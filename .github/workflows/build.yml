name: build

on:
  push:
    branches: [main]
    tags: ['[0-9]*'] # version tags publish a GitHub Release (see release job)
  pull_request:
  workflow_dispatch:

# the vendor build is expensive — cancel superseded runs of the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # all the build/test/vendor tooling is shell: lint it at warning severity
  # (style-level nits stay advisory; intentional word splitting carries
  # explicit shellcheck directives in the scripts)
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -S warning build.sh test.sh vendor.sh update-vendor.sh sources.sh vendor.d/*.sh

  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm # native arm64 — no qemu emulation

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Same build as ./build.sh, with the BuildKit layer cache persisted in
      # the GitHub Actions cache. Every vendored library has its own Docker
      # stage whose cache key is its own vendor.d/<lib>.sh script, so bumping
      # one library's version/sha256 recompiles only that library (plus the
      # ffmpeg stage that links it); every other library restores from cache.
      - name: Build static binary
        uses: docker/build-push-action@v7
        with:
          context: .
          target: dist
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=webify-${{ matrix.arch }}
          cache-to: type=gha,scope=webify-${{ matrix.arch }},mode=max
          # release binaries self-identify by their tag; branch/PR builds
          # report "dev" (the Dockerfile default — only the tiny final
          # compile stage rebuilds when this changes)
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

      - name: Smoke check
        run: |
          ls -lh dist/webify
          file dist/webify
          ./dist/webify --version

      # The hermetic `test` stage bundles the built binary with a digest-pinned
      # ffmpeg, so the fixtures — and the golden hashes — are byte-stable and
      # need no host toolchain. It reuses the cached build stage, and exports
      # the whole graph back (test depends on build, so this is a superset of the
      # dist export) so the test stage's own layers are cached too. Running it
      # enforces WEBIFY_GOLDEN=1: any behavioral OR byte-exact regression fails
      # the job, which gates the whole matrix and the release.
      - name: Build hermetic test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          load: true
          tags: webify-test:ci
          cache-from: type=gha,scope=webify-${{ matrix.arch }}
          cache-to: type=gha,scope=webify-${{ matrix.arch }},mode=max

      - name: Test suite (behavioral + golden)
        run: docker run --rm webify-test:ci

      # tar keeps the executable bit (upload-artifact alone strips it). The
      # binary is GPL-2.0+, so its license text travels inside the tarball
      # (srr-update extracts only the `webify` member)
      - name: Pack
        run: tar -czf webify-linux-${{ matrix.arch }}.tar.gz -C dist webify -C .. COPYING

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: webify-linux-${{ matrix.arch }}
          path: webify-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  # On tag builds (pushed tags, or the vendor-update workflow dispatching on
  # the tag it created — GITHUB_TOKEN-pushed tags never fire on:push), attach
  # both arch binaries to a GitHub Release for the tag. needs waits for the
  # whole matrix, so a release only ever ships when both arches built.
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload its assets
    steps:
      # checkout first: it cleans the workspace, which would drop the
      # downloaded binaries
      - uses: actions/checkout@v7

      # the binaries are GPL-2.0+ (x264, FFmpeg --enable-gpl): never publish
      # one without its license text
      - name: License guard
        run: |
          test -s COPYING || { echo '::error::COPYING is missing — the GPL binaries cannot ship without it'; exit 1; }

      - uses: actions/download-artifact@v8
        with:
          pattern: webify-linux-*
          merge-multiple: true

      # the GPL's "complete corresponding source": this repo at the tag plus
      # the exact upstream tarballs its vendor.d pins, sha256-verified
      - name: Corresponding source
        run: ./sources.sh 'webify-${{ github.ref_name }}-source'

      - name: Create release and attach binaries, license and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' -R '${{ github.repository }}' \
              --verify-tag --title '${{ github.ref_name }}' \
              --notes 'Static `webify` binaries (linux amd64 + arm64), vendor state `${{ github.ref_name }}`. GPL-2.0-or-later: see `COPYING`; the complete corresponding source is `webify-${{ github.ref_name }}-source.tar.gz`.' \
            || echo 'release already exists — refreshing assets'
          gh release upload '${{ github.ref_name }}' -R '${{ github.repository }}' --clobber \
              webify-linux-*.tar.gz COPYING 'webify-${{ github.ref_name }}-source.tar.gz'
